name: Dependency graphs

on:
  push:
    branches: [main]
    paths:
      - 'docs/paper-map.html'
      - 'docs/assets/paper-map.*'
      - 'docs/graphs/paper-results/*.json'
      - 'scripts/build-docs-site.mjs'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'docs/paper-map.html'
      - 'docs/assets/paper-map.*'
      - 'docs/graphs/paper-results/*.json'
      - 'scripts/build-docs-site.mjs'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graphs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package public graphs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.1

      - name: Package the viewer and paper maps
        run: node scripts/build-docs-site.mjs "$RUNNER_TEMP/lpp-pages"

      - name: Upload public site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/lpp-pages
          include-hidden-files: true

  deploy:
    name: Publish dependency graphs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
